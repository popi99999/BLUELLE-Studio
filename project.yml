name: BluelleStudio
options:
  bundleIdPrefix: com.bluelle
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BluelleStudio:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - Sources/StudioCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluelle.studio
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - BluelleStudioUITests
  BluelleStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: BluelleStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bluelle.studio.uitests
